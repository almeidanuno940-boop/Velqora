[build]
  # O Netlify instala as dependências com Bun por detetar o bun.lock; o comando abaixo não depende do gestor.
  command = "node scripts/sync-site-url.mjs && node scripts/check-legal.mjs && vite build"
  publish = "dist/client"

[build.environment]
  NODE_VERSION = "22"

# Functions v2: /api/lead está declarado em netlify/functions/lead.ts (config.path).
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Cabeçalhos de segurança dos ficheiros estáticos. As páginas renderizadas no servidor recebem os
# mesmos valores em src/lib/security-headers.ts (mantenha os dois iguais).
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Content-Security-Policy = "frame-ancestors 'none'"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
